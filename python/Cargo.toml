[package]
name = "gribberishpy"
version = "1.8.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "gribberishpy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["abi3-py312"] }
gribberish = { path = "../gribberish", version = "1.8.2" }
numpy = "0.29.0"
